type: object
description: Where the experience starts.
required: [name]
properties:
  name:
    type: string
    description: >-
      Short human-readable name. For a guest pickup it reads "Pickup at your accommodation".
    example: "〒600-8012 Kyoto"
  address:
    type: string
    description: Formatted address line.
    example: "Japan, 〒600-8012 Kyoto, Shimogyo Ward, 四条大橋西詰"
  lat:
    type: number
    format: double
    description: Latitude in decimal degrees (WGS84).
    example: 35.0298797
  lon:
    type: number
    format: double
    description: Longitude in decimal degrees (WGS84).
    example: 135.7807599
  instructions:
    type: string
    description: Free-text guidance from the host for finding the meeting spot.
    example: "Wait at the main gate"
  mapsUrl:
    type: string
    format: uri
    description: Link that opens the meeting spot in Google Maps. Present whenever `lat` and `lon` are present.
    example: "https://www.google.com/maps/search/?api=1&query=35.0298797,135.7807599"
